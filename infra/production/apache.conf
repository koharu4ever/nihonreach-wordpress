<VirtualHost *:80>
    DocumentRoot /opt/nrc/site
    <Directory /opt/nrc/site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>
    <Directory /opt/nrc/site/wp-content/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "^(wp-config\.php|xmlrpc\.php|install\.php|setup-config\.php)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
